<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentoría Puma - Evaluación y Auditoría</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for JSX parsing in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pumaRed: '#e31837',
                        pumaDarkRed: '#be122c',
                        pumaGreen: '#007a3d',
                        pumaDarkGreen: '#005e2f',
                        pumaLightGreen: '#e6f4ed',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Criteria Rubric Items Definition
        const RUBRIC_CRITERIA = [
            {
                id: 1,
                title: "01  Imagen y Presentación Personal",
                description: "Uniforme limpio, gafete visible, postura elegante y profesional."
            },
            {
                id: 2,
                title: "02  Protocolo de Servicio al Cliente",
                description: "Recive al cliente en la puerta, usa el protocolo de atención en orden, Saludo amable, lenguaje fluido y cortesía constante."
            },
            {
                id: 3,
                title: "03  Promoción e Interacción Puma Pris",
                description: "Invita al cliente a usar la app y/o descargarla, explica beneficios destacando las promociones y ayuda en problemas simples."
            },
            {
                id: 4,
                title: "04  Revisión de Fluidos e Impulso de Lubricantes",
                description: "Ofrece revisar motor, identifica el lubricante correcto según el auto y vende."
            },
            {
                id: 5,
                title: "05  Operación Puma Flota y Medios de Pago",
                description: "Manejo rápido del POS, identifica los metodos de pago, hace la pre-autorozación, usa el surtidor en litros, no acumula Puntos Pris."
            },
            {
                id: 6,
                title: "06  Seguridad y Control de Cisternas",
                description: " Tiene equipo de seguridad, conoce las normas de seguridad, conoce medición de tanques y protocolos de emergencia."
            },
            {
                id: 7,
                title: "07  Cierre de Turno",
                description: "En conjunto con el encargado, cuadre exacto y sin faltsntes, avisa con antelación si hay faltantes o sobrantes en cierre."
            },
            {
                id: 8,
                title: "08  Comunicación y Trabajo en Equipo",
                description: "Acepta la retroalimentación, se comunica con respeto con compañeros y mandos."
            }
        ];

        // Level Helpers
        const getLevelBadge = (score, criteriaCount) => {
            if (criteriaCount === 0) return { label: 'Sin evaluar', bg: 'bg-slate-100', text: 'text-slate-600', color: 'slate' };
            const avg = score / 8;
            if (avg >= 3.5) return { label: 'Excelente', bg: 'bg-emerald-100', text: 'text-emerald-800', color: 'emerald' };
            if (avg >= 2.5) return { label: 'Competente', bg: 'bg-green-100', text: 'text-green-800', color: 'green' };
            if (avg >= 1.5) return { label: 'En Desarrollo', bg: 'bg-amber-100', text: 'text-amber-800', color: 'amber' };
            return { label: 'Necesita Mejora', bg: 'bg-rose-100', text: 'text-rose-800', color: 'rose' };
        };

        function App() {
            // General Station Data
            const [stationData, setStationData] = useState({
                stationName: '',
                coachName: '',
                evaluationDate: new Date().toISOString().split('T')[0]
            });

            // Pisteros List
            const [pisteros, setPisteros] = useState([
                {
                    id: 1,
                    name: '',
                    scores: {}, // { 1: score, 2: score, ... }
                    coachNotes: ''
                }
            ]);

            // Station Observations
            const [stationObs, setStationObs] = useState({
                general: '',
                maintenance: '',
                security: ''
            });

            // Handlers
            const handleAddPistero = () => {
                const newPistero = {
                    id: Date.now(),
                    name: '',
                    scores: {},
                    coachNotes: ''
                };
                setPisteros([...pisteros, newPistero]);
            };

            const handleRemovePistero = (id) => {
                if (pisteros.length === 1) return;
                setPisteros(pisteros.filter(p => p.id !== id));
            };

            const handlePisteroNameChange = (id, name) => {
                setPisteros(pisteros.map(p => p.id === id ? { ...p, name } : p));
            };

            const handleScoreChange = (pisteroId, criteriaId, score) => {
                setPisteros(pisteros.map(p => {
                    if (p.id === pisteroId) {
                        return {
                            ...p,
                            scores: { ...p.scores, [criteriaId]: score }
                        };
                    }
                    return p;
                }));
            };

            const handleNotesChange = (pisteroId, coachNotes) => {
                setPisteros(pisteros.map(p => p.id === pisteroId ? { ...p, coachNotes } : p));
            };

            // Global Calculations
            const calculatePisteroTotal = (scores) => {
                return Object.values(scores).reduce((a, b) => a + Number(b), 0);
            };

            const totalEvaluatedPisteros = pisteros.filter(p => Object.keys(p.scores).length > 0).length;
            
            const globalTotalScore = pisteros.reduce((acc, p) => acc + calculatePisteroTotal(p.scores), 0);
            const globalAvgScore = pisteros.length > 0 ? (globalTotalScore / pisteros.length) : 0;
            const globalPercentage = ((globalAvgScore / 32) * 100).toFixed(1);

            const handlePrintPDF = () => {
                window.print();
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Header Banner */}
                    <div className="bg-pumaRed text-white relative overflow-hidden pb-8 pt-6 px-4 shadow-md">
                        {/* Geometric Circle Details */}
                        <div className="absolute top-[-20px] right-[-30px] w-48 h-48 rounded-full border-[18px] border-amber-900/20 pointer-events-none"></div>
                        <div className="absolute bottom-[-50px] right-[20px] w-64 h-64 rounded-full border-[24px] border-amber-900/10 pointer-events-none"></div>
                        
                        <div className="max-w-xl mx-auto">
                            <div className="inline-flex items-center gap-2 bg-white text-pumaGreen font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider mb-3 shadow-sm">
                                <span className="w-2 h-2 rounded-full bg-pumaGreen"></span>
                                Puma Energy
                            </div>
                            <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">
                                Mentoría Puma
                            </h1>
                            <p className="text-white/90 text-sm md:text-base font-medium flex items-center gap-2">
                                <i className="fa-regular fa-[#f0f0f0] fa-clipboard-check text-lg"></i>
                                Evaluación y auditoría de estaciones de servicio
                            </p>
                        </div>
                    </div>

                    {/* Main Container */}
                    <div className="max-w-xl mx-auto px-4 -mt-3 relative z-10 space-y-6">

                        {/* SECTION 1: Datos de la Estación */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="p-5 border-b border-slate-100 flex items-start gap-3">
                                <span className="w-7 h-7 rounded-lg bg-pumaGreen text-white font-bold flex items-center justify-center text-sm shrink-0">
                                    1
                                </span>
                                <div>
                                    <h2 className="text-lg font-bold text-slate-800 leading-tight">
                                        Datos de la Estación
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-0.5">
                                        Información general de la evaluación.
                                    </p>
                                </div>
                            </div>
                            <div className="p-5 space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                                        Nombre de la Estación de Servicio
                                    </label>
                                    <input 
                                        type="text"
                                        placeholder="Ej. Puma Las Américas"
                                        value={stationData.stationName}
                                        onChange={(e) => setStationData({...stationData, stationName: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                                        Nombre del Coach / Evaluador
                                    </label>
                                    <input 
                                        type="text"
                                        placeholder="Nombre completo"
                                        value={stationData.coachName}
                                        onChange={(e) => setStationData({...stationData, coachName: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                                        Fecha de Evaluación
                                    </label>
                                    <input 
                                        type="date"
                                        value={stationData.evaluationDate}
                                        onChange={(e) => setStationData({...stationData, evaluationDate: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* SECTION 2: Evaluación de Pisteros */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="p-5 border-b border-slate-100 flex items-start justify-between">
                                <div className="flex items-start gap-3">
                                    <span className="w-7 h-7 rounded-lg bg-pumaGreen text-white font-bold flex items-center justify-center text-sm shrink-0">
                                        2
                                    </span>
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800 leading-tight">
                                            Evaluación de Pisteros
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-0.5">
                                            Califica cada criterio de 1 (Necesita Mejora) a 4 (Excelente).
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <div className="p-5 space-y-6">
                                {/* Top Add Button */}
                                <button
                                    onClick={handleAddPistero}
                                    type="button"
                                    className="w-full py-3 bg-pumaGreen hover:bg-pumaDarkGreen text-white font-bold text-sm rounded-xl flex items-center justify-center gap-2 transition shadow-sm active:scale-[0.99] no-print"
                                >
                                    <i className="fa-solid fa-user-plus text-base"></i>
                                    Agregar pistero
                                </button>

                                {/* Pistero Cards */}
                                {pisteros.map((pistero, index) => {
                                    const totalScore = calculatePisteroTotal(pistero.scores);
                                    const evaluatedCount = Object.keys(pistero.scores).length;
                                    const badge = getLevelBadge(totalScore, evaluatedCount);

                                    return (
                                        <div key={pistero.id} className="bg-slate-50/70 border border-slate-200 rounded-2xl overflow-hidden print-card">
                                            {/* Pistero Card Header */}
                                            <div className="p-4 bg-white border-b border-slate-100">
                                                <div className="flex items-center justify-between gap-2 mb-3">
                                                    <span className="text-xs font-bold text-slate-700">
                                                        Nombre del Pistero
                                                    </span>
                                                    {pisteros.length > 1 && (
                                                        <button 
                                                            onClick={() => handleRemovePistero(pistero.id)}
                                                            className="text-xs text-rose-600 hover:text-rose-800 font-semibold no-print"
                                                        >
                                                            <i className="fa-solid fa-trash-can mr-1"></i> Eliminar
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-xl bg-pumaRed text-white font-black text-lg flex items-center justify-center shrink-0">
                                                        {index + 1}
                                                    </div>
                                                    <input
                                                        type="text"
                                                        placeholder="Nombre completo"
                                                        value={pistero.name}
                                                        onChange={(e) => handlePisteroNameChange(pistero.id, e.target.value)}
                                                        className="w-full px-3.5 py-2 text-sm font-medium rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                                    />
                                                </div>

                                                {/* Pistero Individual Score Bar */}
                                                <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                                                    <div>
                                                        <p className="text-[10px] font-bold tracking-wider text-slate-400 uppercase">
                                                            Total Individual
                                                        </p>
                                                        <p className="text-xl font-black text-slate-800">
                                                            {totalScore} <span className="text-sm font-normal text-slate-400">/ 32</span>
                                                        </p>
                                                    </div>
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${badge.bg} ${badge.text}`}>
                                                        {badge.label}
                                                    </span>
                                                </div>
                                            </div>

                                            {/* Rubric Header */}
                                            <div className="p-4 border-b border-slate-200/60 bg-slate-100/50 flex items-center justify-between">
                                                <span className="text-[11px] font-extrabold tracking-wider text-slate-500 uppercase">
                                                    RÚBRICA DE EVALUACIÓN
                                                </span>
                                                <span className="text-xs font-semibold text-slate-500">
                                                    {evaluatedCount} de 8 criterios calificados
                                                </span>
                                            </div>

                                            {/* Criteria Questions */}
                                            <div className="p-4 space-y-6 bg-white">
                                                {RUBRIC_CRITERIA.map((criterion) => {
                                                    const selectedValue = pistero.scores[criterion.id];

                                                    return (
                                                        <div key={criterion.id} className="space-y-2 border-b border-slate-100 pb-5 last:border-0 last:pb-0">
                                                            <div>
                                                                <h4 className="text-sm font-bold text-slate-800 leading-snug">
                                                                    <span className="text-pumaGreen font-bold mr-1">{criterion.title.substring(0, 2)}</span>
                                                                    {criterion.title.substring(2)}
                                                                </h4>
                                                                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                                                                    {criterion.description}
                                                                </p>
                                                            </div>

                                                            {/* Rating Scale Buttons */}
                                                            <div className="grid grid-cols-4 gap-2 pt-1">
                                                                {[
                                                                    { val: 1, label: "Necesita Mejora" },
                                                                    { val: 2, label: "En Desarrollo" },
                                                                    { val: 3, label: "Competente" },
                                                                    { val: 4, label: "Excelente" }
                                                                ].map((btn) => {
                                                                    const isSelected = selectedValue === btn.val;
                                                                    return (
                                                                        <button
                                                                            key={btn.val}
                                                                            type="button"
                                                                            onClick={() => handleScoreChange(pistero.id, criterion.id, btn.val)}
                                                                            className={`py-2 px-1 rounded-xl border text-center transition-all ${
                                                                                isSelected
                                                                                    ? 'bg-slate-800 text-white border-slate-800 font-bold shadow-sm'
                                                                                    : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300 font-medium'
                                                                            }`}
                                                                        >
                                                                            <div className="text-base font-black leading-tight">{btn.val}</div>
                                                                            <div className="text-[9px] leading-tight opacity-90 mt-0.5">{btn.label}</div>
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                })}

                                                {/* Coach Observations per Pistero */}
                                                <div className="pt-3 border-t border-slate-100">
                                                    <label className="block text-xs font-bold text-slate-800 mb-1.5">
                                                        Observaciones / Compromisos del Coach
                                                    </label>
                                                    <textarea
                                                        rows="3"
                                                        placeholder="Fortalezas observadas, áreas de mejora y compromisos acordados..."
                                                        value={pistero.coachNotes}
                                                        onChange={(e) => handleNotesChange(pistero.id, e.target.value)}
                                                        className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                                    ></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}

                                {/* Bottom Add Button */}
                                <button
                                    onClick={handleAddPistero}
                                    type="button"
                                    className="w-full py-3.5 border-2 border-dashed border-pumaGreen/60 hover:border-pumaGreen text-pumaGreen font-bold text-sm rounded-xl flex items-center justify-center gap-2 transition hover:bg-pumaGreen/5 active:scale-[0.99] no-print"
                                >
                                    <i className="fa-solid fa-user-plus text-base"></i>
                                    Agregar otro pistero
                                </button>
                            </div>
                        </div>

                        {/* SECTION 3: Observaciones de la Estación */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="p-5 border-b border-slate-100 flex items-start gap-3">
                                <span className="w-7 h-7 rounded-lg bg-pumaGreen text-white font-bold flex items-center justify-center text-sm shrink-0">
                                    3
                                </span>
                                <div>
                                    <h2 className="text-lg font-bold text-slate-800 leading-tight">
                                        Observaciones de la Estación
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-0.5">
                                        Hallazgos generales, de mantenimiento y de seguridad.
                                    </p>
                                </div>
                            </div>
                            <div className="p-5 space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                                        Observaciones Generales de la Estación
                                    </label>
                                    <textarea
                                        rows="3"
                                        placeholder="Imagen de la estación, flujo de clientes, clima laboral..."
                                        value={stationObs.general}
                                        onChange={(e) => setStationObs({...stationObs, general: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                    ></textarea>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                                        Mantenimiento
                                    </label>
                                    <textarea
                                        rows="3"
                                        placeholder="Estado de dispensadores, iluminación, baños, señalización..."
                                        value={stationObs.maintenance}
                                        onChange={(e) => setStationObs({...stationObs, maintenance: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                    ></textarea>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                                        Seguridad
                                    </label>
                                    <textarea
                                        rows="3"
                                        placeholder="Extintores, rutas de evacuación, derrames, EPP, descarga de cisternas..."
                                        value={stationObs.security}
                                        onChange={(e) => setStationObs({...stationObs, security: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen focus:border-transparent transition"
                                    ></textarea>
                                </div>
                            </div>
                        </div>

                        {/* GLOBAL SUMMARY CARD */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="bg-pumaGreen text-white p-4">
                                <span className="text-[10px] font-bold tracking-widest opacity-80 uppercase block">
                                    RESULTADO GLOBAL
                                </span>
                                <h3 className="text-xl font-extrabold leading-tight">
                                    Resumen General
                                </h3>
                            </div>

                            <div className="p-5 space-y-5">
                                {/* Score Indicator Box */}
                                <div className="bg-slate-50 rounded-2xl p-5 text-center border border-slate-100">
                                    <p className="text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-1">
                                        PUNTUACIÓN PROMEDIO
                                    </p>
                                    <div className="text-4xl font-black text-slate-800 mb-1">
                                        {globalAvgScore.toFixed(0)} <span className="text-xl font-normal text-slate-400">/ 32</span>
                                    </div>
                                    <p className="text-xs text-slate-500 font-medium mb-3">
                                        {globalPercentage}% · {totalEvaluatedPisteros} de {pisteros.length} pistero(s) evaluado(s)
                                    </p>

                                    {/* Overall Status Badge */}
                                    <div className="inline-block">
                                        {(() => {
                                            const globalBadge = getLevelBadge(globalAvgScore, totalEvaluatedPisteros);
                                            return (
                                                <span className={`px-4 py-1.5 rounded-full text-xs font-bold ${globalBadge.bg} ${globalBadge.text}`}>
                                                    {globalBadge.label}
                                                </span>
                                            );
                                        })()}
                                    </div>
                                </div>

                                {/* Pisteros Score List */}
                                <div>
                                    <h4 className="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">
                                        PISTEROS
                                    </h4>
                                    <div className="divide-y divide-slate-100 border-t border-b border-slate-100">
                                        {pisteros.map((p, idx) => {
                                            const pScore = calculatePisteroTotal(p.scores);
                                            return (
                                                <div key={p.id} className="py-2.5 flex items-center justify-between text-sm">
                                                    <span className="font-semibold text-slate-700">
                                                        {p.name.trim() || `Pistero ${idx + 1}`}
                                                    </span>
                                                    <span className="font-bold text-slate-800">
                                                        {pScore}/32
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Scale Guide */}
                                <div className="pt-2">
                                    <h4 className="text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-2">
                                        ESCALA DE NIVELES
                                    </h4>
                                    <div className="grid grid-cols-2 gap-2 text-xs font-medium text-slate-600">
                                        <div className="flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
                                            <span>4 · Excelente</span>
                                        </div>
