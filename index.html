<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentoría Puma - Evaluación y Auditoría</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for JSX parsing in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pumaRed: '#e31837',
                        pumaDarkRed: '#be122c',
                        pumaGreen: '#007a3d',
                        pumaDarkGreen: '#005e2f',
                        pumaLightGreen: '#e6f4ed',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const RUBRIC_CRITERIA = [
            {
                id: 1,
                title: "01  Imagen y Presentación Personal",
                description: "Uniforme limpio, gafete visible, postura elegante y profesional."
            },
            {
                id: 2,
                title: "02  Protocolo de Servicio al Cliente",
                description: "Recibe al cliente en la puerta, usa el protocolo de atención en orden, saludo amable, lenguaje fluido y cortesía constante."
            },
            {
                id: 3,
                title: "03  Promoción e Interacción Puma Pris",
                description: "Invita al cliente a usar la app y/o descargarla, explica beneficios destacando las promociones y ayuda en problemas simples."
            },
            {
                id: 4,
                title: "04  Revisión de Fluidos e Impulso de Lubricantes",
                description: "Ofrece revisar motor, identifica el lubricante correcto según el auto y vende."
            },
            {
                id: 5,
                title: "05  Operación Puma Flota y Medios de Pago",
                description: "Manejo rápido del POS, identifica los métodos de pago, hace la pre-autorización, usa el surtidor en litros, no acumula Puntos Pris."
            },
            {
                id: 6,
                title: "06  Seguridad y Control de Cisternas",
                description: "Tiene equipo de seguridad, conoce las normas de seguridad, conoce medición de tanques y protocolos de emergencia."
            },
            {
                id: 7,
                title: "07  Cierre de Turno",
                description: "En conjunto con el encargado, cuadre exacto y sin faltantes, avisa con antelación si hay faltantes o sobrantes en cierre."
            },
            {
                id: 8,
                title: "08  Comunicación y Trabajo en Equipo",
                description: "Acepta la retroalimentación, se comunica con respeto con compañeros y mandos."
            }
        ];

        const getLevelBadgeFromPercentage = (percentage) => {
            if (percentage === 100) return { label: 'Excelente', bg: 'bg-[#005e2f]', text: 'text-white' }; // Verde oscuro exacto 100%
            if (percentage > 89) return { label: 'Competente', bg: 'bg-[#e6f4ed] border border-[#007a3d]', text: 'text-[#007a3d]' }; // Verde claro
            if (percentage > 79) return { label: 'En desarrollo', bg: 'bg-amber-100', text: 'text-amber-800' }; // Amarillo
            return { label: 'Necesita Mejora', bg: 'bg-rose-100', text: 'text-rose-800' }; // Rojo
        };

        function App() {
            const [stationData, setStationData] = useState({
                stationName: '',
                coachName: '',
                supervisorName: '',
                evaluationDate: new Date().toISOString().split('T')[0]
            });

            const [pisteros, setPisteros] = useState([
                {
                    id: 1,
                    name: '',
                    scores: {}, // guarda valores numéricos (1-4) o 'NA'
                    coachNotes: ''
                }
            ]);

            const [stationObs, setStationObs] = useState({
                general: '',
                maintenance: '',
                security: '',
                managerSignerName: ''
            });

            const handleAddPistero = () => {
                setPisteros([...pisteros, { id: Date.now(), name: '', scores: {}, coachNotes: '' }]);
            };

            const handleRemovePistero = (id) => {
                if (pisteros.length === 1) return;
                setPisteros(pisteros.filter(p => p.id !== id));
            };

            const handlePisteroNameChange = (id, name) => {
                setPisteros(pisteros.map(p => p.id === id ? { ...p, name } : p));
            };

            const handleScoreChange = (pisteroId, criteriaId, value) => {
                setPisteros(pisteros.map(p => {
                    if (p.id === pisteroId) {
                        return { ...p, scores: { ...p.scores, [criteriaId]: value } };
                    }
                    return p;
                }));
            };

            const handleNotesChange = (pisteroId, coachNotes) => {
                setPisteros(pisteros.map(p => p.id === pisteroId ? { ...p, coachNotes } : p));
            };

            const calculatePisteroStats = (scores) => {
                let applicableCount = 0;
                let obtainedSum = 0;

                RUBRIC_CRITERIA.forEach(c => {
                    const val = scores[c.id];
                    if (val !== 'NA' && val !== undefined) {
                        applicableCount++;
                        obtainedSum += Number(val);
                    }
                });

                const maxPossible = applicableCount * 4;
                const percentage = maxPossible > 0 ? Number(((obtainedSum / maxPossible) * 100).toFixed(1)) : 0;
                return { obtainedSum, maxPossible, applicableCount, percentage };
            };

            // Cálculo Global
            let totalObtainedGlobal = 0;
            let totalMaxGlobal = 0;
            let totalApplicableCriteria = 0;
            let evaluatedPisterosCount = 0;

            pisteros.forEach(p => {
                const stats = calculatePisteroStats(p.scores);
                if (stats.applicableCount > 0) {
                    evaluatedPisterosCount++;
                    totalObtainedGlobal += stats.obtainedSum;
                    totalMaxGlobal += stats.maxPossible;
                    totalApplicableCriteria += stats.applicableCount;
                }
            });

            const globalPercentage = totalMaxGlobal > 0 ? Number(((totalObtainedGlobal / totalMaxGlobal) * 100).toFixed(1)) : 0;

            const handleGeneratePDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');

                const estacion = stationData.stationName || "Estación sin nombre";
                const evaluador = stationData.coachName || "Sin especificar";
                const supervisor = stationData.supervisorName || "Sin especificar";
                const fecha = stationData.evaluationDate || "Sin fecha";
                const obsGral = stationObs.general || "Sin observaciones registradas.";
                const obsMant = stationObs.maintenance || "Sin observaciones registradas.";
                const obsSeg = stationObs.security || "Sin observaciones registradas.";
                const managerSigner = stationObs.managerSignerName || "Gerente / Encargado";

                let nivelGralObj = getLevelBadgeFromPercentage(globalPercentage);
                let nivelGralText = nivelGralObj.label.toUpperCase();

                // --- PÁGINA 1 ---
                doc.setFillColor(227, 24, 55);
                doc.rect(0, 0, 210, 22, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("PUMA ENERGY", 14, 14);

                doc.setTextColor(30, 30, 30);
                doc.setFontSize(14);
                doc.text("Mentoría Puma Ficha de Evaluación de Estación de Servicio", 14, 32);

                doc.setFontSize(10);
                doc.setFont("helvetica", "bold");
                doc.text("DATOS GENERALES DE LA EVALUACIÓN", 14, 42);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(9);
                doc.text(`Estación de Servicio: ${estacion}`, 14, 49);
                doc.text(`Coach / Evaluador: ${evaluador}`, 14, 55);
                doc.text(`Supervisor / Encargado: ${supervisor}`, 14, 61);
                doc.text(`Fecha de Evaluación: ${fecha}`, 14, 67);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("RESULTADO GLOBAL DE LA ESTACIÓN", 14, 77);
                doc.setFillColor(0, 94, 47);
                doc.roundedRect(14, 81, 182, 20, 2, 2, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(11);
                doc.text(`RESULTADO GLOBAL: ${globalPercentage}% (${totalObtainedGlobal} / ${totalMaxGlobal} pts) - ${nivelGralText}`, 20, 93);

                doc.setTextColor(30, 30, 30);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("RESUMEN DE PISTEROS", 14, 110);

                let startY = 116;
                doc.setFillColor(240, 240, 240);
                doc.rect(14, startY, 182, 8, 'F');
                doc.setFont("helvetica", "bold");
                doc.setFontSize(8);
                doc.text("#", 18, startY + 5);
                doc.text("Pistero", 30, startY + 5);
                doc.text("Puntaje", 110, startY + 5);
                doc.text("%", 135, startY + 5);
                doc.text("Nivel", 160, startY + 5);

                startY += 8;
                doc.setFont("helvetica", "normal");
                pisteros.forEach((p, idx) => {
                    let stats = calculatePisteroStats(p.scores);
                    let pNivelObj = getLevelBadgeFromPercentage(stats.percentage);
                    let nomP = p.name.trim() || `Pistero ${idx + 1}`;

                    doc.text(`${idx + 1}`, 18, startY + 5);
                    doc.text(nomP, 30, startY + 5);
                    doc.text(`${stats.obtainedSum}/${stats.maxPossible}`, 110, startY + 5);
                    doc.text(`${stats.percentage}%`, 135, startY + 5);
                    doc.text(pNivelObj.label, 160, startY + 5);
                    startY += 8;
                });

                startY += 6;
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("DETALLE DE RÚBRICA POR CRITERIO", 14, startY);
                startY += 6;

                doc.setFillColor(240, 240, 240);
                doc.rect(14, startY, 182, 8, 'F');
                doc.setFontSize(8);
                doc.text("Criterio", 18, startY + 5);
                pisteros.forEach((p, idx) => {
                    doc.text(`P${idx + 1}`, 150 + (idx * 12), startY + 5);
                });

                startY += 8;
                doc.setFont("helvetica", "normal");
                RUBRIC_CRITERIA.forEach(c => {
                    doc.text(`${c.id}. ${c.title.substring(2).trim().substring(0, 42)}`, 18, startY + 5);
                    pisteros.forEach((p, idx) => {
                        let val = p.scores[c.id];
                        let displayVal = val === 'NA' ? 'N/A' : (val || '0');
                        doc.text(`${displayVal}`, 152 + (idx * 12), startY + 5);
                    });
                    startY += 7;
                });

                doc.setFontSize(7);
                doc.setTextColor(120, 120, 120);
                doc.text("1 = Necesita Mejora | 2 = En desarrollo | 3 = Competente | 4 = Excelente | N/A = No Aplica", 14, startY + 6);
                doc.text("Mentoría Puma · Puma Energy", 14, 285);
                doc.text("Página 1 de 2", 185, 285, { align: "right" });

                // --- PÁGINA 2 ---
                doc.addPage();
                doc.setFillColor(227, 24, 55);
                doc.rect(0, 0, 210, 22, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.text("PUMA ENERGY", 14, 14);

                doc.setTextColor(30, 30, 30);
                doc.setFontSize(12);
                doc.text("OBSERVACIONES Y COMPROMISOS DEL COACH", 14, 32);

                startY = 38;
                doc.setFillColor(240, 240, 240);
                doc.rect(14, startY, 182, 8, 'F');
                doc.setFontSize(8);
                doc.text("Pistero", 18, startY + 5);
                doc.text("Observaciones / Compromisos", 60, startY + 5);

                startY += 8;
                doc.setFont("helvetica", "normal");
                pisteros.forEach((p, idx) => {
                    let nomP = p.name.trim() || `Pistero ${idx + 1}`;
                    let obsP = p.coachNotes.trim() || "Sin observaciones registradas.";
                    doc.text(nomP, 18, startY + 5);
                    doc.text(obsP, 60, startY + 5, { maxWidth: 130 });
                    startY += 12;
                });

                startY += 6;
                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.text("OBSERVACIONES FINALES DE LA ESTACIÓN", 14, startY);
                
                startY += 6;
                doc.setFontSize(9);
                doc.text("Observaciones Generales de la Estación:", 14, startY);
                doc.setFont("helvetica", "normal");
                doc.text(obsGral, 14, startY + 5, { maxWidth: 182 });

                startY += 16;
                doc.setFont("helvetica", "bold");
                doc.text("Mantenimiento:", 14, startY);
                doc.setFont("helvetica", "normal");
                doc.text(obsMant, 14, startY + 5, { maxWidth: 182 });

                startY += 16;
                doc.setFont("helvetica", "bold");
                doc.text("Seguridad:", 14, startY);
                doc.setFont("helvetica", "normal");
                doc.text(obsSeg, 14, startY + 5, { maxWidth: 182 });

                startY += 25;
                doc.setFont("helvetica", "bold");
                doc.text("FIRMAS DE CONFORMIDAD Y VALIDACIÓN", 14, startY);

                startY += 25;
                doc.line(14, startY, 90, startY);
                doc.line(120, startY, 196, startY);

                doc.setFont("helvetica", "normal");
                doc.setFontSize(8);
                doc.text(`Evaluador: ${evaluador}`, 14, startY + 5);
                doc.text("Firma y Sello", 14, startY + 9);

                doc.text(`${managerSigner}`, 120, startY + 5);
                doc.text("Firma digital / Conformidad", 120, startY + 9);

                doc.text("Mentoría Puma · Puma Energy", 14, 285);
                doc.text("Página 2 de 2", 185, 285, { align: "right" });

                doc.save(`Reporte_Evaluacion_${estacion.replace(/\s+/g, '_')}.pdf`);
            };

            return (
                <div className="min-h-screen pb-12">
                    <div className="bg-pumaRed text-white relative overflow-hidden pb-8 pt-6 px-4 shadow-md">
                        <div className="absolute top-[-20px] right-[-30px] w-48 h-48 rounded-full border-[18px] border-amber-900/20 pointer-events-none"></div>
                        <div className="absolute bottom-[-50px] right-[20px] w-64 h-64 rounded-full border-[24px] border-amber-900/10 pointer-events-none"></div>
                        
                        <div className="max-w-xl mx-auto">
                            <div className="inline-flex items-center gap-2 bg-white text-pumaGreen font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider mb-3 shadow-sm">
                                <span className="w-2 h-2 rounded-full bg-pumaGreen"></span>
                                Puma Energy
                            </div>
                            <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">
                                Mentoría Puma
                            </h1>
                            <p className="text-white/90 text-sm md:text-base font-medium flex items-center gap-2">
                                <i className="fa-regular fa-clipboard-check text-lg"></i>
                                Evaluación y auditoría de estaciones de servicio
                            </p>
                        </div>
                    </div>

                    <div className="max-w-xl mx-auto px-4 -mt-3 relative z-10 space-y-6">

                        {/* SECTION 1 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="p-5 border-b border-slate-100 flex items-start gap-3">
                                <span className="w-7 h-7 rounded-lg bg-pumaGreen text-white font-bold flex items-center justify-center text-sm shrink-0">1</span>
                                <div>
                                    <h2 className="text-lg font-bold text-slate-800 leading-tight">Datos de la Estación</h2>
                                    <p className="text-xs text-slate-500 mt-0.5">Información general de la evaluación.</p>
                                </div>
                            </div>
                            <div className="p-5 space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nombre de la Estación de Servicio</label>
                                    <input 
                                        type="text"
                                        placeholder="Ej. Puma Las Américas"
                                        value={stationData.stationName}
                                        onChange={(e) => setStationData({...stationData, stationName: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nombre del Coach / Evaluador</label>
                                    <input 
                                        type="text"
                                        placeholder="Nombre completo del evaluador"
                                        value={stationData.coachName}
                                        onChange={(e) => setStationData({...stationData, coachName: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nombre del Supervisor o Encargado</label>
                                    <input 
                                        type="text"
                                        placeholder="Nombre del supervisor o encargado de estación"
                                        value={stationData.supervisorName}
                                        onChange={(e) => setStationData({...stationData, supervisorName: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Fecha de Evaluación</label>
                                    <input 
                                        type="date"
                                        value={stationData.evaluationDate}
                                        onChange={(e) => setStationData({...stationData, evaluationDate: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* SECTION 2 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="p-5 border-b border-slate-100 flex items-start justify-between">
                                <div className="flex items-start gap-3">
                                    <span className="w-7 h-7 rounded-lg bg-pumaGreen text-white font-bold flex items-center justify-center text-sm shrink-0">2</span>
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800 leading-tight">Evaluación de Pisteros</h2>
                                        <p className="text-xs text-slate-500 mt-0.5">Califica cada criterio de 1 a 4 o marca N/A si no aplica.</p>
                                    </div>
                                </div>
                            </div>

                            <div className="p-5 space-y-6">
                                <button
                                    onClick={handleAddPistero}
                                    type="button"
                                    className="w-full py-3 bg-pumaGreen hover:bg-pumaDarkGreen text-white font-bold text-sm rounded-xl flex items-center justify-center gap-2 transition shadow-sm active:scale-[0.99] no-print"
                                >
                                    <i className="fa-solid fa-user-plus text-base"></i>
                                    Agregar pistero
                                </button>

                                {pisteros.map((pistero, index) => {
                                    const stats = calculatePisteroStats(pistero.scores);
                                    const badge = getLevelBadgeFromPercentage(stats.percentage);

                                    return (
                                        <div key={pistero.id} className="bg-slate-50/70 border border-slate-200 rounded-2xl overflow-hidden print-card">
                                            <div className="p-4 bg-white border-b border-slate-100">
                                                <div className="flex items-center justify-between gap-2 mb-3">
                                                    <span className="text-xs font-bold text-slate-700">Nombre del Pistero</span>
                                                    {pisteros.length > 1 && (
                                                        <button 
                                                            onClick={() => handleRemovePistero(pistero.id)}
                                                            className="text-xs text-rose-600 hover:text-rose-800 font-semibold no-print"
                                                        >
                                                            <i className="fa-solid fa-trash-can mr-1"></i> Eliminar
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-xl bg-pumaRed text-white font-black text-lg flex items-center justify-center shrink-0">
                                                        {index + 1}
                                                    </div>
                                                    <input
                                                        type="text"
                                                        placeholder="Nombre completo"
                                                        value={pistero.name}
                                                        onChange={(e) => handlePisteroNameChange(pistero.id, e.target.value)}
                                                        className="w-full px-3.5 py-2 text-sm font-medium rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                                    />
                                                </div>

                                                <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                                                    <div>
                                                        <p className="text-[10px] font-bold tracking-wider text-slate-400 uppercase">Puntuación Ajustada (N/A excluidos)</p>
                                                        <p className="text-xl font-black text-slate-800">
                                                            {stats.obtainedSum} <span className="text-sm font-normal text-slate-400">/ {stats.maxPossible} ({stats.percentage}%)</span>
                                                        </p>
                                                    </div>
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold ${badge.bg} ${badge.text}`}>
                                                        {badge.label}
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="p-4 border-b border-slate-200/60 bg-slate-100/50 flex items-center justify-between">
                                                <span className="text-[11px] font-extrabold tracking-wider text-slate-500 uppercase">RÚBRICA DE EVALUACIÓN</span>
                                                <span className="text-xs font-semibold text-slate-500">{stats.applicableCount} aplicables ({Object.keys(pistero.scores).length} marcados)</span>
                                            </div>

                                            <div className="p-4 space-y-6 bg-white">
                                                {RUBRIC_CRITERIA.map((criterion) => {
                                                    const selectedValue = pistero.scores[criterion.id];

                                                    return (
                                                        <div key={criterion.id} className="space-y-2 border-b border-slate-100 pb-5 last:border-0 last:pb-0">
                                                            <div>
                                                                <h4 className="text-sm font-bold text-slate-800 leading-snug">
                                                                    <span className="text-pumaGreen font-bold mr-1">{criterion.title.substring(0, 2)}</span>
                                                                    {criterion.title.substring(2)}
                                                                </h4>
                                                                <p className="text-xs text-slate-500 mt-1 leading-relaxed">
                                                                    {criterion.description}
                                                                </p>
                                                            </div>

                                                            <div className="grid grid-cols-5 gap-1.5 pt-1">
                                                                {[
                                                                    { val: 1, label: "Necesita", color: "bg-[#d90429] text-white border-[#d90429]" },
                                                                    { val: 2, label: "Desarrollo", color: "bg-[#f59e0b] text-white border-[#f59e0b]" },
                                                                    { val: 3, label: "Competente", color: "bg-[#10b981] text-white border-[#10b981]" },
                                                                    { val: 4, label: "Excelente", color: "bg-[#007a3d] text-white border-[#007a3d]" },
                                                                    { val: 'NA', label: "No Aplica", color: "bg-slate-600 text-white border-slate-600" }
                                                                ].map((btn) => {
                                                                    const isSelected = selectedValue === btn.val;
                                                                    return (
                                                                        <button
                                                                            key={String(btn.val)}
                                                                            type="button"
                                                                            onClick={() => handleScoreChange(pistero.id, criterion.id, btn.val)}
                                                                            className={`py-2 px-0.5 rounded-xl border text-center transition-all ${
                                                                                isSelected
                                                                                    ? `${btn.color} font-bold shadow-sm`
                                                                                    : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300 font-medium'
                                                                            }`}
                                                                        >
                                                                            <div className="text-sm md:text-base font-black leading-tight">{btn.val}</div>
                                                                            <div className="text-[8px] leading-tight opacity-90 mt-0.5">{btn.label}</div>
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    );
                                                })}

                                                <div className="pt-3 border-t border-slate-100">
                                                    <label className="block text-xs font-bold text-slate-800 mb-1.5">Observaciones / Compromisos del Coach</label>
                                                    <textarea
                                                        rows="3"
                                                        placeholder="Fortalezas observadas, áreas de mejora y compromisos acordados..."
                                                        value={pistero.coachNotes}
                                                        onChange={(e) => handleNotesChange(pistero.id, e.target.value)}
                                                        className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                                    ></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}

                                <button
                                    onClick={handleAddPistero}
                                    type="button"
                                    className="w-full py-3.5 border-2 border-dashed border-pumaGreen/60 hover:border-pumaGreen text-pumaGreen font-bold text-sm rounded-xl flex items-center justify-center gap-2 transition hover:bg-pumaGreen/5 active:scale-[0.99] no-print"
                                >
                                    <i className="fa-solid fa-user-plus text-base"></i>
                                    Agregar otro pistero
                                </button>
                            </div>
                        </div>

                        {/* SECTION 3 */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="p-5 border-b border-slate-100 flex items-start gap-3">
                                <span className="w-7 h-7 rounded-lg bg-pumaGreen text-white font-bold flex items-center justify-center text-sm shrink-0">3</span>
                                <div>
                                    <h2 className="text-lg font-bold text-slate-800 leading-tight">Observaciones de la Estación y Firmas</h2>
                                    <p className="text-xs text-slate-500 mt-0.5">Hallazgos generales, mantenimiento, seguridad y datos de firma.</p>
                                </div>
                            </div>
                            <div className="p-5 space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Observaciones Generales de la Estación</label>
                                    <textarea
                                        rows="3"
                                        placeholder="Imagen de la estación, flujo de clientes, clima laboral..."
                                        value={stationObs.general}
                                        onChange={(e) => setStationObs({...stationObs, general: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    ></textarea>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Mantenimiento</label>
                                    <textarea
                                        rows="3"
                                        placeholder="Estado de dispensadores, iluminación, baños, señalización..."
                                        value={stationObs.maintenance}
                                        onChange={(e) => setStationObs({...stationObs, maintenance: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    ></textarea>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Seguridad</label>
                                    <textarea
                                        rows="3"
                                        placeholder="Extintores, rutas de evacuación, derrames, EPP, descarga de cisternas..."
                                        value={stationObs.security}
                                        onChange={(e) => setStationObs({...stationObs, security: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    ></textarea>
                                </div>
                                <div className="pt-2 border-t border-slate-100">
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nombre para Firma Digital / Encargado Receptor</label>
                                    <input 
                                        type="text"
                                        placeholder="Ej. Juan Pérez (Gerente de Turno / Estación)"
                                        value={stationObs.managerSignerName}
                                        onChange={(e) => setStationObs({...stationObs, managerSignerName: e.target.value})}
                                        className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pumaGreen transition"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* GLOBAL SUMMARY CARD */}
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
                            <div className="bg-pumaGreen text-white p-4">
                                <span className="text-[10px] font-bold tracking-widest opacity-80 uppercase block">RESULTADO GLOBAL</span>
                                <h3 className="text-xl font-extrabold leading-tight">Resumen General</h3>
                            </div>

                            <div className="p-5 space-y-5">
                                <div className="bg-slate-50 rounded-2xl p-5 text-center border border-slate-100">
                                    <p className="text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-1">PORCENTAJE GLOBAL DE LA ESTACIÓN</p>
                                    <div className="text-4xl font-black text-slate-800 mb-1">
                                        <span className="text-pumaRed underline decoration-2">{globalPercentage}%</span>
                                    </div>
                                    <p className="text-xs text-slate-500 font-medium mb-3">
                                        {totalObtainedGlobal} de {totalMaxGlobal} puntos posibles ({evaluatedPisterosCount} pistero(s) evaluados)
                                    </p>

                                    <div className="inline-block">
                                        {(() => {
                                            const globalBadge = getLevelBadgeFromPercentage(globalPercentage);
                                            return (
                                                <span className={`px-4 py-1.5 rounded-full text-xs font-bold ${globalBadge.bg} ${globalBadge.text}`}>
                                                    {globalBadge.label}
                                                </span>
                                            );
                                        })()}
                                    </div>
                                </div>

                                <div>
                                    <h4 className="text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">PISTEROS</h4>
                                    <div className="divide-y divide-slate-100 border-t border-b border-slate-100">
                                        {pisteros.map((p, idx) => {
                                            const stats = calculatePisteroStats(p.scores);
                                            return (
                                                <div key={p.id} className="py-2.5 flex items-center justify-between text-sm">
                                                    <span className="font-semibold text-slate-700">{p.name.trim() || `Pistero ${idx + 1}`}</span>
                                                    <span className="font-bold text-slate-800">{stats.percentage}% ({stats.obtainedSum}/{stats.maxPossible})</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <h4 className="text-[10px] font-bold tracking-wider text-slate-400 uppercase mb-2">ESCALA DE NIVELES</h4>
                                    <div className="grid grid-cols-2 gap-2 text-xs font-medium text-slate-600">
                                        <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-[#005e2f] shrink-0"></span><span>100% · Excelente</span></div>
                                        <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span><span>&gt; 89% · Competente</span></div>
                                        <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"></span><span>&gt; 79% · En desarrollo</span></div>
                                        <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-rose-500 shrink-0"></span><span>&lt; 80% · Necesita Mejora</span></div>
                                    </div>
                                </div>

                                <button
                                    onClick={handleGeneratePDF}
                                    type="button"
                                    className="w-full py-3.5 bg-pumaRed hover:bg-pumaDarkRed text-white font-extrabold text-sm rounded-xl flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition active:scale-[0.99] no-print"
                                >
                                    <i className="fa-solid fa-file-pdf text-base"></i>
                                    GENERAR REPORTE PDF
                                </button>
                            </div>
                        </div>

                        <div className="text-center pt-4 pb-2">
                            <p className="text-xs text-slate-400 font-medium">Mentoría Puma · Puma Energy</p>
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
